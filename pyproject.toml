[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abc-iueh"
version = "0.1.0"
description = "Reproducible quaternion data pipeline for the 9th ABC Challenge"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "h5py>=3.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
abc-iueh = "abc_iueh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
